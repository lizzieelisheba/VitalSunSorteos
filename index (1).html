  firebase.initializeApp(firebaseConfig);
  const __db = firebase.firestore();
  const __KV_COLLECTION = 'kv';

  function __sanitizeKey(key) {
    return String(key).replace(/\//g, '__');
  }

  // Polyfill de window.storage respaldado por Firestore,
  // con la misma forma que usa el sistema de sorteos.
  window.storage = {
    async get(key, shared) {
      try {
        const snap = await __db.collection(__KV_COLLECTION).doc(__sanitizeKey(key)).get();
        if (!snap.exists) return null;
        return { key, value: snap.data().value, shared: !!shared };
      } catch (e) {
        console.error('storage.get error', e);
        return null;
      }
    },
    async set(key, value, shared) {
      try {
        await __db.collection(__KV_COLLECTION).doc(__sanitizeKey(key)).set({ value, updatedAt: Date.now() });
        return { key, value, shared: !!shared };
      } catch (e) {
        console.error('storage.set error', e);
        return null;
      }
    },
    async delete(key, shared) {
      try {
        await __db.collection(__KV_COLLECTION).doc(__sanitizeKey(key)).delete();
        return { key, deleted: true, shared: !!shared };
      } catch (e) {
        console.error('storage.delete error', e);
        return null;
      }
    },
    async list(prefix, shared) {
      try {
        const p = __sanitizeKey(prefix);
        const snap = await __db.collection(__KV_COLLECTION)
          .orderBy(firebase.firestore.FieldPath.documentId())
          .startAt(p)
          .endAt(p + '\uf8ff')
          .get();
        const keys = snap.docs.map((d) => d.id);
        return { keys };
      } catch (e) {
        console.error('storage.list error', e);
        return { keys: [] };
      }
    }
  };
</script>

function formatGs(n) {
  return (Number(n) || 0).toLocaleString('es-PY') + ' Gs.';
}

function formatDateLong(dateStr) {
  if (!dateStr) return 'A confirmar';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return 'A confirmar';
  return d.toLocaleDateString('es-PY', { day: 'numeric', month: 'long', year: 'numeric' });
}

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const target = new Date(dateStr + 'T00:00:00');
  if (isNaN(target.getTime())) return null;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  return Math.round((target - now) / 86400000);
}

function countdownText(dateStr) {
  const d = daysUntil(dateStr);
  if (d === null) return '';
  if (d > 1) return `Faltan ${d} días`;
  if (d === 1) return '¡El sorteo es mañana!';
  if (d === 0) return '¡Hoy es el día del sorteo!';
  return 'Sorteo pendiente de realizar';
}

function suggestNextDrawDate(prevDateStr) {
  const prev = prevDateStr ? new Date(prevDateStr + 'T00:00:00') : new Date();
  const base = isNaN(prev.getTime()) ? new Date() : prev;
  const next = new Date(base.getFullYear(), base.getMonth() + 2, 0);
  return next.toISOString().slice(0, 10);
}

function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('No se pudo procesar la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function buildPool(participantsList) {

  participantsList.filter((p) => p.status === 'activo').forEach((p) => {

  });
  return pool;
}

/* ============================================================
   GENERADOR DE IMAGEN DEL TICKET (canvas nativo, sin librerías)

function drawRoundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawSunIcon(ctx, cx, cy, r, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(2, r * 0.22);
  ctx.lineCap = 'round';
  const rayInner = r * 1.4;
  const rayOuter = r * 2.15;
  for (let i = 0; i < 8; i++) {
    const angle = (Math.PI / 4) * i;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(angle) * rayInner, cy + Math.sin(angle) * rayInner);
    ctx.lineTo(cx + Math.cos(angle) * rayOuter, cy + Math.sin(angle) * rayOuter);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function wrapCanvasText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let current = '';
  words.forEach((word) => {
    const test = current ? current + ' ' + word : word;
    if (ctx.measureText(test).width > maxWidth && current) {
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  });
  if (current) lines.push(current);
  return lines.length ? lines : [''];
}

function layoutChips(ctx, items, maxWidth, gap, padX) {
  const rows = [];
  let row = [];
  let x = 0;
  items.forEach((text) => {
    const width = ctx.measureText(text).width + padX * 2;
    if (x + width > maxWidth && row.length) {
      rows.push(row);
      row = [];
      x = 0;
    }
    row.push({ text, width });
    x += width + gap;
  });
  if (row.length) rows.push(row);
  return rows;
}

function buildTicketCanvas(ticket, cfg) {
  const W = 1000;
  const marginX = 70;
  const cardX = marginX;
  const cardW = W - marginX * 2;
  const cardPad = 40;
  const contentW = cardW - cardPad * 2;
  const chipH = 44;
  const chipGap = 10;
  const chipPadX = 16;

  const fontLabel = '600 20px sans-serif';
  const fontTitle = '700 28px sans-serif';
  const fontName = '700 28px sans-serif';
  const fontChip = '700 20px monospace';
  const fontTotal = '800 32px sans-serif';
  const fontBrand = '800 38px sans-serif';
  const fontTagline = 'italic 400 19px sans-serif';
  const fontHeading = '800 30px sans-serif';
  const fontFooter = 'italic 400 19px sans-serif';

  const scratch = document.createElement('canvas').getContext('2d');

  scratch.font = fontTitle;
  const titleLines = wrapCanvasText(scratch, `${cfg.title} — ${cfg.prize}`, contentW);

  scratch.font = fontName;
  const nameLines = wrapCanvasText(scratch, ticket.name, contentW);

  scratch.font = fontChip;
  const chipRows = layoutChips(scratch, ticket.ticketNumbers, contentW, chipGap, chipPadX);

  let cardContentH = 0;
  cardContentH += 24 + 8;
  cardContentH += titleLines.length * 36 + 20;
  cardContentH += 24 + 8;
  cardContentH += nameLines.length * 36 + 20;
  cardContentH += 24 + 10;
  cardContentH += chipRows.length * (chipH + 10) + 14;
  cardContentH += 24 + 8;
  cardContentH += 38;
  const cardH = cardContentH + cardPad * 2;

  const topPad = 64;
  const brandBlockH = 46 + 46;
  const headingBlockH = 50;
  const footerBlockH = 60;
  const bottomPad = 56;
  const H = topPad + brandBlockH + headingBlockH + cardH + footerBlockH + bottomPad;

  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#fffbeb');
  bg.addColorStop(0.5, '#fff7ed');
  bg.addColorStop(1, '#fef3c7');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2;
  let y = topPad;

  ctx.font = fontBrand;
  const brandText = 'VitalSun';
  const brandTextW = ctx.measureText(brandText).width;
  const sunR = 15;
  const brandTotalW = brandTextW + sunR * 2 + 12;
  const brandStartX = cx - brandTotalW / 2;
  drawSunIcon(ctx, brandStartX + sunR, y, sunR, '#f97316');
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#78350f';
  ctx.fillText(brandText, brandStartX + sunR * 2 + 12, y + 2);
  y += 46;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.font = fontTagline;
  ctx.fillStyle = '#b45309';
  ctx.fillText('brilla con vitalidad', cx, y);
  y += 46;

  ctx.font = fontHeading;
  ctx.fillStyle = '#78350f';
  ctx.fillText('¡Ya estás participando!', cx, y);
  y += 50;

  const cardY = y;
  ctx.fillStyle = '#ffffff';
  drawRoundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.fill();
  ctx.setLineDash([12, 8]);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#fbbf24';
  drawRoundRect(ctx, cardX, cardY, cardW, cardH, 24);
  ctx.stroke();
  ctx.setLineDash([]);

  let ty = cardY + cardPad;
  const tx = cardX + cardPad;
  ctx.textAlign = 'left';

  ctx.font = fontLabel;
  ctx.fillStyle = '#78716c';
  ctx.fillText('Sorteo', tx, ty + 18);
  ty += 24 + 8;

  ctx.font = fontTitle;
  ctx.fillStyle = '#78350f';
  titleLines.forEach((line) => {
    ctx.fillText(line, tx, ty + 24);
    ty += 36;
  });
  ty += 20;

  ctx.font = fontLabel;
  ctx.fillStyle = '#78716c';
  ctx.fillText('Participante', tx, ty + 18);
  ty += 24 + 8;

  ctx.font = fontName;
  ctx.fillStyle = '#292524';
  nameLines.forEach((line) => {
    ctx.fillText(line, tx, ty + 24);
    ty += 36;
  });
  ty += 20;

  ctx.font = fontLabel;
  ctx.fillStyle = '#78716c';
  ctx.fillText(`Números de ticket (${ticket.qty})`, tx, ty + 18);
  ty += 24 + 10;

  ctx.font = fontChip;
  chipRows.forEach((row) => {
    let rx = tx;
    row.forEach((chip) => {
      ctx.fillStyle = '#fef3c7';
      drawRoundRect(ctx, rx, ty, chip.width, chipH, 10);
      ctx.fill();
      ctx.fillStyle = '#78350f';
      ctx.textAlign = 'center';
      ctx.fillText(chip.text, rx + chip.width / 2, ty + chipH / 2 + 7);
      ctx.textAlign = 'left';
      rx += chip.width + chipGap;
    });
    ty += chipH + 10;
  });
  ty += 14;

  ctx.font = fontLabel;
  ctx.fillStyle = '#78716c';
  ctx.fillText('Total abonado', tx, ty + 18);
  ty += 24 + 8;

  ctx.font = fontTotal;
  ctx.fillStyle = '#78350f';
  ctx.fillText(formatGs(ticket.total), tx, ty + 26);

  y = cardY + cardH + 46;
  ctx.textAlign = 'center';
  ctx.font = fontFooter;
  ctx.fillStyle = '#78716c';
  ctx.fillText('Guardá este comprobante. ¡Mucha suerte!', cx, y);

  return canvas;
}

function Confetti() {
  const pieces = Array.from({ length: 36 });
  const colors = ['bg-amber-400', 'bg-orange-500', 'bg-yellow-400', 'bg-amber-600', 'bg-red-400', 'bg-amber-300'];
  return (
    <div className="fixed inset-0 pointer-events-none overflow-hidden z-50">
      {pieces.map((_, i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 2;
        const duration = 2.5 + Math.random() * 2;
        const color = colors[i % colors.length];
        return (
          <div
            key={i}
            className={`absolute w-2 h-3 ${color} opacity-80 rounded-sm`}
            style={{ left: `${left}%`, top: '-10px', animation: `confetti-fall ${duration}s linear ${delay}s infinite` }}
          />
        );
      })}
      <style>{`
        @keyframes confetti-fall {
          0% { transform: translateY(0) rotate(0deg); opacity: 1; }
          100% { transform: translateY(110vh) rotate(360deg); opacity: 0.3; }
        }
      `}</style>
    </div>
  );
}

    if (!raffleConfig) return;
    setLoadingParticipants(true);
    try {
      const listRes = await window.storage.list(`ticket:${raffleConfig.roundId}:`, true);
      const keys = (listRes && listRes.keys) || [];
      const results = await Promise.allSettled(keys.map((k) => window.storage.get(k, true)));
      const items = results

    const rows = participants

        const fecha = new Date(p.timestamp).toLocaleString('es-PY');
        return `"${p.name}","${p.phone}","${p.social}",${p.qty},"${(p.ticketNumbers || []).join(' ')}",${p.total},${p.status},"${fecha}"`;
      })
      .join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');

  function startDraw({ isReplay, pool, winnerEntry, duration }) {
    setError('');
    if (!isReplay && (!pool || pool.length === 0)) {
      setError('No hay tickets activos para sortear.');
      return;
    }
    const finalPool = pool && pool.length > 0 ? pool : [winnerEntry];
    const finalWinner = isReplay ? winnerEntry : finalPool[Math.floor(Math.random() * finalPool.length)];
    setStep('draw');
    setDrawing(true);
    cancelRef.current = false;
    const dur = duration || DRAW_DURATION_MS;
    const start = performance.now();

    function tick(now) {
      if (cancelRef.current) return;
      const elapsed = now - start;
      const progress = Math.min(elapsed / dur, 1);
      setReelProgress(progress);
      if (progress >= 1) {
        setReelEntry(finalWinner);
        setWinner(finalWinner);
        setDrawing(false);
        if (!isReplay) storageSet(`winner:${raffleConfig.roundId}`, finalWinner);
        setStep('winner');
        return;
      }
      const randEntry = finalPool[Math.floor(Math.random() * finalPool.length)];
      setReelEntry(randEntry);
      const eased = Math.pow(progress, 3);
      const delay = 40 + eased * 760;
      setTimeout(() => requestAnimationFrame(tick), delay);
    }
    requestAnimationFrame(tick);
  }

                  <input type="number" value={configDraft.price} onChange={(e) => setConfigDraft({ ...configDraft, price: parseInt(e.target.value) || 0 })} placeholder="Precio por ticket (Gs.)" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <label className="text-xs text-stone-500 block">Fecha de sorteo</label>
                  <input type="date" value={configDraft.drawDate} onChange={(e) => setConfigDraft({ ...configDraft, drawDate: e.target.value })} className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <div className="flex gap-2 pt-1">
                    <button onClick={() => setEditingConfig(false)} className="flex-1 py-2 rounded-lg border border-stone-300 text-sm">Cancelar</button>
                    <button onClick={saveConfig} className="flex-1 py-2 rounded-lg bg-amber-800 text-white text-sm">Guardar</button>
                  </div>
                </div>
              )}
            </div>

            {/* Datos bancarios */}
            <div className="bg-white rounded-2xl p-5 shadow border border-amber-200 mb-4">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-amber-900 flex items-center gap-2"><Building2 size={17} /> Datos Bancarios</h3>
                {!editingBank && (
                  <button onClick={() => { setBankDraft(bankInfo); setEditingBank(true); }} className="text-xs text-amber-700 underline">
                    Editar
                  </button>
                )}
              </div>
              {!editingBank ? (
                <div className="space-y-1 text-sm text-stone-700">
                  <p><span className="font-semibold">Banco:</span> {bankInfo.banco}</p>
                  <p><span className="font-semibold">Titular:</span> {bankInfo.titular}</p>
                  <p><span className="font-semibold">Cuenta:</span> {bankInfo.cuenta}</p>
                  <p><span className="font-semibold">CI/RUC:</span> {bankInfo.documento}</p>
                </div>
              ) : (
                <div className="space-y-2">
                  <input value={bankDraft.banco} onChange={(e) => setBankDraft({ ...bankDraft, banco: e.target.value })} placeholder="Banco" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <input value={bankDraft.titular} onChange={(e) => setBankDraft({ ...bankDraft, titular: e.target.value })} placeholder="Titular" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <input value={bankDraft.cuenta} onChange={(e) => setBankDraft({ ...bankDraft, cuenta: e.target.value })} placeholder="N° de Cuenta" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <input value={bankDraft.documento} onChange={(e) => setBankDraft({ ...bankDraft, documento: e.target.value })} placeholder="CI/RUC" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                  <div className="flex gap-2 pt-1">
                    <button onClick={() => setEditingBank(false)} className="flex-1 py-2 rounded-lg border border-stone-300 text-sm">Cancelar</button>
                    <button onClick={saveBankInfo} className="flex-1 py-2 rounded-lg bg-amber-800 text-white text-sm">Guardar</button>
                  </div>
                </div>
              )}
            </div>

            {/* Sorteo / nueva ronda */}
            <div className="bg-white rounded-2xl p-5 shadow border border-amber-200 mb-4 space-y-3">
              {!winner ? (
                <>
                  <label className="flex items-center gap-2 text-xs text-stone-500">
                    <input type="checkbox" checked={testMode} onChange={(e) => setTestMode(e.target.checked)} />
                    Modo prueba (sorteo rápido de 8 segundos)
                  </label>
                  <button
                    onClick={() => setShowConfirmDraw(true)}
                    className="w-full py-3 rounded-full bg-gradient-to-r from-amber-700 to-orange-700 text-white font-bold flex items-center justify-center gap-2"
                  >
                    <Trophy size={18} /> Realizar Sorteo
                  </button>
                </>
              ) : (
                <>
                  <p className="text-sm text-stone-700">
                    🏆 Ganador/a: <span className="font-bold">{winner.name}</span> (Ticket {winner.ticketNumber})
                  </p>
                  <button onClick={handleViewResult} className="w-full py-2.5 rounded-full border border-amber-300 text-amber-800 text-sm font-semibold">
                    Ver animación nuevamente
                  </button>
                </>
              )}
              <button
                onClick={() => {
                  setNewRoundDraft({ title: '', prize: '', detail: '', price: raffleConfig.price, drawDate: suggestNextDrawDate(raffleConfig.drawDate) });
                  setShowNewRoundForm(true);
                }}
                className="w-full py-2.5 rounded-full border-2 border-amber-700 text-amber-800 font-bold flex items-center justify-center gap-2 text-sm"
              >
                <RefreshCw size={16} /> Iniciar Nuevo Sorteo
              </button>
            </div>

            {/* Historial */}
            {history.length > 0 && (
              <div className="bg-white rounded-2xl p-5 shadow border border-amber-200 mb-4">
                <h3 className="font-bold text-amber-900 flex items-center gap-2 mb-3"><History size={17} /> Historial de Sorteos</h3>
                <div className="space-y-2 max-h-56 overflow-y-auto">
                  {[...history].reverse().map((h, i) => (
                    <div key={i} className="text-sm border-b border-stone-100 pb-2">
                      <p className="font-semibold text-stone-800">{h.title}</p>
                      <p className="text-stone-500 text-xs">{h.prize} {h.detail} · {formatDateLong(h.drawDate)}</p>
                      {h.winnerName ? (
                        <p className="text-amber-700 text-xs mt-0.5">🏆 {h.winnerName} (Ticket {h.winnerTicket}) · {h.totalTickets} tickets</p>
                      ) : (
                        <p className="text-stone-400 text-xs mt-0.5">Sin sorteo realizado</p>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Participantes */}
            <div className="bg-white rounded-2xl p-5 shadow border border-amber-200">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-bold text-amber-900">Participantes</h3>
                <div className="flex items-center gap-3">
                  <button onClick={loadParticipants} className="text-amber-700 text-xs flex items-center gap-1">
                    <RefreshCw size={13} /> Actualizar
                  </button>
                  <button onClick={exportCSV} disabled={participants.length===0} className="text-amber-700 text-xs flex items-center gap-1 disabled:opacity-40">
                    <Download size={13} /> CSV
                  </button>
                </div>
              </div>
              {loadingParticipants ? (
                <div className="flex justify-center py-6"><Loader2 className="animate-spin text-amber-600" size={22} /></div>
              ) : participants.length === 0 ? (
                <p className="text-sm text-stone-400 text-center py-4">Todavía no hay compras registradas.</p>
              ) : (
                <div className="space-y-2 max-h-96 overflow-y-auto">
                  {participants.map((p) => (
                    <div key={p.id} className="border border-stone-100 rounded-xl p-3">
                      <div className="flex items-start justify-between">
                        <div className="min-w-0 flex-1">
                          <p className="font-semibold text-stone-800 text-sm truncate">{p.name}</p>
                          <p className="text-xs text-stone-500">{p.phone} · {p.social}</p>
                          <p className="text-xs text-stone-500 mt-1">{p.qty} ticket(s) · {formatGs(p.total)}</p>
                          <p className="text-[11px] text-stone-400 font-mono mt-0.5">{(p.ticketNumbers||[]).join(', ')}</p>
                        </div>
                        {p.proofImage && (
                          <button onClick={() => setSelectedProof(p.proofImage)} className="flex-shrink-0 ml-2">
                            <img src={p.proofImage} alt="comprobante" className="w-12 h-12 rounded-lg object-cover border border-stone-200" />
                          </button>
                        )}
                      </div>
                      <div className="mt-2 flex items-center gap-2">
                        <button
                          onClick={() => toggleStatus(p)}
                          className={`text-xs font-semibold px-2 py-1 rounded-full flex items-center gap-1 w-fit ${p.status === 'activo' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}
                        >
                          {p.status === 'activo' ? <Check size={12} /> : <X size={12} />}
                          {p.status === 'activo' ? 'Activo' : 'Rechazado'}
                        </button>
                        <button
                          onClick={() => setParticipantToDelete(p)}
                          className="text-xs font-semibold px-2 py-1 rounded-full flex items-center gap-1 w-fit bg-stone-100 text-stone-500 hover:bg-red-100 hover:text-red-700"
                        >
                          <Trash2 size={12} /> Eliminar
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )}

        {step === 'draw' && (
          <div className="fixed inset-0 bg-gradient-to-b from-amber-800 via-orange-800 to-amber-900 flex flex-col items-center justify-center p-6 z-40">
            <Sparkles className="text-amber-200 mb-4 animate-pulse" size={32} />
            <p className="text-amber-100 font-bold text-lg mb-6 tracking-wide">Sorteando...</p>
            {loadingParticipants ? (
              <Loader2 className="animate-spin text-white" size={32} />
            ) : (
              <>
                <div key={reelEntry ? reelEntry.ticketNumber + Math.random() : 'x'} className="bg-white rounded-2xl px-8 py-6 text-center shadow-2xl w-full max-w-xs">
                  <p className="font-mono text-2xl font-extrabold text-amber-900">{reelEntry ? reelEntry.ticketNumber : '---'}</p>
                  <p className="text-stone-600 font-semibold mt-1 truncate">{reelEntry ? reelEntry.name : '...'}</p>
                </div>
                <div className="w-full max-w-xs bg-amber-900/40 rounded-full h-2 mt-8 overflow-hidden">
                  <div className="bg-amber-200 h-2 rounded-full transition-all" style={{ width: `${Math.round(reelProgress * 100)}%` }} />
                </div>
                <p className="text-amber-200 text-xs mt-2">No cierres esta ventana...</p>
              </>
            )}
          </div>
        )}

        {step === 'winner' && winner && (
          <div className="text-center pt-8">
            <Confetti />
            <Trophy className="text-amber-600 mx-auto mb-3" size={56} />
            <h2 className="text-3xl font-extrabold text-amber-900 mb-4">¡FELICIDADES!!</h2>
            <p className="text-2xl font-bold text-stone-800 mb-1">{winner.name}</p>
            <p className="text-sm text-stone-500 mb-4">Ticket ganador: {winner.ticketNumber}</p>
            <p className="text-amber-700 mb-2">Ha sido el ganador/a de:</p>
            <div className="bg-white rounded-2xl border-2 border-amber-300 p-4 inline-block mb-8">
              <p className="font-bold text-amber-900">{raffleConfig.prize}</p>
              {raffleConfig.detail && <p className="text-sm text-amber-700">{raffleConfig.detail}</p>}
            </div>
            <button
              onClick={() => { setStep('home'); setIsAdmin(false); }}
              className="w-full bg-gradient-to-r from-amber-700 to-orange-700 text-white rounded-full py-3.5 font-bold shadow-md"
            >
              Volver al Inicio
            </button>
          </div>
        )}

        {showConfirmDraw && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
              <p className="font-bold text-amber-900 mb-2">¿Iniciar el sorteo?</p>
              <p className="text-sm text-stone-600 mb-4">
                Se elegirá un ganador/a de forma aleatoria entre {buildPool(participants).length} tickets activos. Esta acción no se puede deshacer.
              </p>
              <div className="flex gap-2">
                <button onClick={() => setShowConfirmDraw(false)} className="flex-1 py-2 rounded-full border border-stone-300">Cancelar</button>
                <button onClick={() => { setShowConfirmDraw(false); handleAdminDraw(); }} className="flex-1 py-2 rounded-full bg-amber-800 text-white">Confirmar</button>
              </div>
            </div>
          </div>
        )}

        {participantToDelete && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
              <p className="font-bold text-amber-900 mb-2">¿Eliminar esta compra?</p>
              <p className="text-sm text-stone-600 mb-4">
                Se eliminará para siempre el registro de <span className="font-semibold">{participantToDelete.name}</span> ({(participantToDelete.ticketNumbers || []).join(', ')}). Esta acción no se puede deshacer.
              </p>
              <div className="flex gap-2">
                <button onClick={() => setParticipantToDelete(null)} className="flex-1 py-2 rounded-full border border-stone-300">Cancelar</button>
                <button onClick={() => deleteParticipant(participantToDelete)} className="flex-1 py-2 rounded-full bg-red-600 text-white">Eliminar</button>
              </div>
            </div>
          </div>
        )}

        {showNewRoundForm && (
          <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
            <div className="bg-white rounded-2xl p-6 max-w-sm w-full max-h-[90vh] overflow-y-auto">
              <h3 className="font-bold text-amber-900 mb-1">Nueva Ronda de Sorteo</h3>
              <p className="text-xs text-stone-500 mb-3">
                La ronda actual (con {participants.length} compra(s){winner ? ' y su ganador/a' : ''}) se guardará en el historial y se abrirá una ronda nueva y vacía.
              </p>
              <div className="space-y-2">
                <input value={newRoundDraft.title} onChange={(e) => setNewRoundDraft({ ...newRoundDraft, title: e.target.value })} placeholder="Título (ej: Sorteo de Setiembre)" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                <input value={newRoundDraft.prize} onChange={(e) => setNewRoundDraft({ ...newRoundDraft, prize: e.target.value })} placeholder="Premio" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                <input value={newRoundDraft.detail} onChange={(e) => setNewRoundDraft({ ...newRoundDraft, detail: e.target.value })} placeholder="Detalle (opcional)" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                <input type="number" value={newRoundDraft.price} onChange={(e) => setNewRoundDraft({ ...newRoundDraft, price: parseInt(e.target.value) || 0 })} placeholder="Precio por ticket (Gs.)" className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
                <label className="text-xs text-stone-500 block">Fecha de sorteo</label>
                <input type="date" value={newRoundDraft.drawDate} onChange={(e) => setNewRoundDraft({ ...newRoundDraft, drawDate: e.target.value })} className="w-full border border-stone-200 rounded-lg px-3 py-2 text-sm" />
              </div>
              <div className="flex gap-2 mt-4">
                <button onClick={() => setShowNewRoundForm(false)} className="flex-1 py-2 rounded-lg border border-stone-300 text-sm">Cancelar</button>
                <button
                  onClick={handleStartNewRound}
                  disabled={!newRoundDraft.title || !newRoundDraft.prize || !newRoundDraft.drawDate || saving}
                  className="flex-1 py-2 rounded-lg bg-amber-800 text-white text-sm disabled:opacity-50"
                >
                  {saving ? 'Guardando...' : 'Confirmar'}
                </button>
              </div>
            </div>
          </div>
        )}

        {selectedProof && (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4" onClick={() => setSelectedProof(null)}>
            <img src={selectedProof} alt="Comprobante ampliado" className="max-w-full max-h-full rounded-xl" />
            <button onClick={() => setSelectedProof(null)} className="absolute top-4 right-4 text-white">
              <X size={28} />
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<SorteosVitalSun />);
</script>
</body>
</html>
